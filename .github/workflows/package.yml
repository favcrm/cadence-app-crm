# CAD-962: independent packaging checks for the app/ bundle.
#
# This workflow is a definition only — it runs nothing until the
# proposed remote `favcrm/cadence-app-crm` exists and receives a push.
# Actions are pinned to commit SHAs per project convention (same pins
# as the host repository). Read-only token; no publication, no
# deployment, no external sends. Python 3 from the runner image is the
# only toolchain — no app runtime is selected by this workflow.

name: package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bundle shape check (offline — not host validation)
        run: python3 scripts/package_app.py check --source app

      - name: Unit tests
        run: python3 -m unittest discover -s tests/unit -v

      - name: Build archive twice — byte-identical required
        run: |
          python3 scripts/package_app.py build --source app --outdir dist/a
          python3 scripts/package_app.py build --source app --outdir dist/b
          cmp dist/a/crm-0.1.0.tar.gz dist/b/crm-0.1.0.tar.gz
          cmp dist/a/crm-0.1.0.tar.gz.sha256 dist/b/crm-0.1.0.tar.gz.sha256

      - name: Verify archive (sidecar digest + member shape)
        run: python3 scripts/package_app.py verify dist/a/crm-0.1.0.tar.gz

      - name: Extract to temp — only bundle paths, identical content
        run: |
          mkdir -p /tmp/crm-stage
          cd /tmp/crm-stage
          cp "$GITHUB_WORKSPACE/dist/a/crm-0.1.0.tar.gz" \
             "$GITHUB_WORKSPACE/dist/a/crm-0.1.0.tar.gz.sha256" .
          sha256sum -c crm-0.1.0.tar.gz.sha256
          tar -xzf crm-0.1.0.tar.gz
          diff -r "$GITHUB_WORKSPACE/app" crm-0.1.0
