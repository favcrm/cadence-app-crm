# AOS-376 / AOS-390 / AOS-384: publish one CRM release as an immutable
# catalogue candidate.
#
# Tag-driven and OIDC-only. The catalogue binds this repository, this workflow
# file and `refs/tags/v<version>` to the CRM app id, re-verifies the uploaded
# bytes/digest/identity, and stores the bundle as a draft. Publishing is not
# releasing: the candidate becomes recommended only after the demo company's
# owner installs exactly it on a hosted host and the platform records that
# result.
#
# The pinned native CLI supplies the canonical bundle digest and inventory from
# `app check`. A hosted-only package such as CRM 0.3.0 (`app-storage: [1]`) is
# refused by the native validator; exit 3 with a digest/inventory report is
# accepted as metadata only. No native install-check, daemon, compatibility
# claim or `compatible: true` is part of a hosted candidate.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      cadence_version:
        description: "Exact Cadence release whose checker contains app-storage grammar v2 (no 'latest')"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - name: Install locked publisher dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the exact pinned Cadence CLI
        env:
          CADENCE_VERSION: ${{ inputs.cadence_version || vars.CADENCE_TARGET_VERSION }}
        run: |
          set -euo pipefail
          if [ -z "${CADENCE_VERSION:-}" ]; then
            echo "Set the cadence_version input or the CADENCE_TARGET_VERSION repository variable." >&2
            echo "A qualification against 'the latest release' is not reproducible; pin the target." >&2
            exit 1
          fi
          version="${CADENCE_VERSION#v}"
          archive="cadence-v${version}-x86_64-linux.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/favcrm/cadence/releases/download/v${version}/${archive}" \
            --output /tmp/cadence.tgz
          mkdir -p /tmp/cadence-bin
          tar -xzf /tmp/cadence.tgz -C /tmp/cadence-bin
          bin=$(dirname "$(find /tmp/cadence-bin -name cadence -type f | head -1)")
          chmod +x "$bin/cadence"
          echo "$bin" >> "$GITHUB_PATH"
          echo "Canonical checker Cadence ${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect the bundle for its canonical digest and inventory
        run: |
          set -euo pipefail
          set +e
          cadence app check app > /tmp/app-check.json
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            echo "app check failed with exit ${status}" >&2
            cat /tmp/app-check.json >&2 || true
            exit 1
          fi
          if [ "$status" -eq 3 ]; then
            echo "Native content admission refused; digest/inventory alone prove neither safety nor compatibility. The publisher independently scans the exact uploaded members." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish the candidate to the catalogue
        env:
          APP_CHECK_JSON: /tmp/app-check.json
          APP_DIR: app
          EXPECTED_REPOSITORY: favcrm/cadence-app-crm
        run: node .github/scripts/publish.mjs
