# CAD-962: independent packaging checks for the app/ bundle.
#
# Runs on pull requests, pushes to main, the merge queue (merge_group)
# and manual dispatch. Actions are pinned to commit SHAs per project
# convention (same pins as the host repository). Read-only token; no
# publication, no deployment, no external sends. The screen uses the SDK
# receipt's exact Node/pnpm pins; Python 3 from the runner checks the bundle.
#
# The archive filename is derived from `build`'s JSON output
# (`archive`/`sidecar`/`app`/`version`), never a hardcoded
# `crm-0.1.0`, so a manifest version bump does not break these steps.

name: package

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify committed SDK archive and extract closed package
        id: sdk
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, stat, tarfile
          from pathlib import Path

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError("Duplicate JSON field")
                  result[key] = value
              return result

          def read_json(path):
              return json.loads(Path(path).read_text(), object_pairs_hook=unique_object)

          def canonical(name):
              return (isinstance(name, str) and bool(name) and "\\" not in name
                      and all(part not in ("", ".", "..") for part in name.split("/")))

          pin = read_json("screen-ui.lock.json")
          source = pin["source"]
          if source["kind"] != "commit" or not re.fullmatch(r"[0-9a-f]{40}", source.get("sourceSha") or ""):
              raise ValueError("Release requires committed SDK provenance; development/null refused")
          package = read_json("package.json")
          node, pnpm = pin["toolchain"]["node"], pin["toolchain"]["pnpm"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", node) or not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", pnpm):
              raise ValueError("Exact Node/pnpm versions required")
          if package["packageManager"] != "pnpm@" + pnpm:
              raise ValueError("SDK/app pnpm pin mismatch")
          archive = pin["archive"]
          if not re.fullmatch(r"cadence-screen-ui-[0-9]+\.[0-9]+\.[0-9]+\.tgz", archive["filename"]):
              raise ValueError("Invalid SDK archive filename")
          sdk = Path(".cadence-ui")
          path = sdk / archive["filename"]
          if sdk.is_symlink() or not stat.S_ISREG(path.lstat().st_mode):
              raise ValueError("SDK archive must be a regular local file")
          if package["dependencies"]["@cadence/screen-ui"] != "file:" + path.as_posix():
              raise ValueError("SDK dependency/archive mismatch")
          data = path.read_bytes()
          if len(data) != archive["bytes"] or hashlib.sha256(data).hexdigest() != archive["sha256"]:
              raise ValueError("SDK archive integrity mismatch")
          expected = set()
          for item in pin["artifacts"]:
              name = item["path"]
              if not canonical(name) or "package/" + name in expected:
                  raise ValueError("Invalid/duplicate declared SDK member")
              expected.add("package/" + name)
          if not expected or os.path.lexists(sdk / "package"):
              raise ValueError("SDK extraction requires declared members and an empty destination")
          with tarfile.open(path, "r:gz") as tf:
              members = tf.getmembers()
              seen, regular, total = set(), set(), 0
              for member in members:
                  name = member.name.rstrip("/")
                  if not canonical(name) or name.split("/")[0] != "package" or name in seen:
                      raise ValueError("Invalid/duplicate SDK archive path")
                  seen.add(name)
                  if member.isdir():
                      if member.name not in (name, name + "/") or not any(p.startswith(name + "/") for p in expected):
                          raise ValueError("Undeclared SDK directory")
                  elif member.isreg() and member.name == name and name in expected and member.size <= 2097152:
                      regular.add(name)
                      total += member.size
                  else:
                      raise ValueError("SDK payload must contain only declared regular files; links refused")
              if regular != expected or total > 4194304:
                  raise ValueError("Missing/oversized SDK archive members")
              for member in members:
                  if member.isreg():
                      target = sdk / member.name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with target.open("xb") as output, tf.extractfile(member) as payload:
                          output.write(payload.read())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"node={node}\npnpm={pnpm}\n")
          PY

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: ${{ steps.sdk.outputs.pnpm }}
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.sdk.outputs.node }}

      - name: Install locked screen dependencies
        run: pnpm install --frozen-lockfile

      - name: Screen typecheck
        run: pnpm run typecheck

      - name: Build real CRM screen (release provenance required)
        run: pnpm run build

      - name: Verify screen and SDK authority boundary
        run: pnpm run verify

      - name: Bundle shape check (offline — not host validation)
        run: python3 scripts/package_app.py check --source app

      - name: Unit tests
        run: python3 -m unittest discover -s tests/unit -v

      - name: Build archive twice — byte-identical required
        run: |
          python3 scripts/package_app.py build --source app --outdir dist/a | tee "$RUNNER_TEMP/build-a.json"
          python3 scripts/package_app.py build --source app --outdir dist/b | tee "$RUNNER_TEMP/build-b.json"
          # Resolve the produced archive/sidecar paths from the build
          # metadata — the name is <app>-<version>.tar.gz and changes
          # with a version bump, so it is never hardcoded here.
          ARCHIVE=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/build-a.json'))['archive'])")
          SIDECAR=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/build-a.json'))['sidecar'])")
          ARCHIVE_B=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/build-b.json'))['archive'])")
          SIDECAR_B=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/build-b.json'))['sidecar'])")
          cmp "$ARCHIVE" "$ARCHIVE_B"
          cmp "$SIDECAR" "$SIDECAR_B"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          echo "SIDECAR=$SIDECAR" >> "$GITHUB_ENV"

      - name: Verify archive (sidecar digest + member shape)
        run: python3 scripts/package_app.py verify "$ARCHIVE"

      - name: Extract to temp — only bundle paths, identical content
        run: |
          STAGE=$(mktemp -d)
          cp "$ARCHIVE" "$SIDECAR" "$STAGE/"
          cd "$STAGE"
          sha256sum -c "$(basename "$SIDECAR")"
          tar -xzf "$(basename "$ARCHIVE")"
          # The bundle root is the single extracted top dir; diff it
          # against the source tree regardless of its versioned name.
          ROOT=$(find . -mindepth 1 -maxdepth 1 -type d ! -name '.' | head -1)
          diff -r "$GITHUB_WORKSPACE/app" "$ROOT"
