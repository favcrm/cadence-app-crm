<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CRM fixture frame</title>
  <style>body { margin: 0; padding: 18px; } /* The board's chat canvas mounts the screen flush; only the full page has workspace padding. */ @media (max-width: 1099px) { body { padding: 0; } }</style>
</head>
<body>
  <div id="root"></div>
  <script id="cadence-screen-boot" type="application/json"></script>
  <script type="module">
    const theme = new URLSearchParams(location.search).get("theme");
    if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
    const boot = document.getElementById("cadence-screen-boot");
    boot.textContent = JSON.stringify({ tag: "crm", bridge_nonce: new URLSearchParams(location.search).get("nonce"), generation: 1, parent_origin: location.origin });
    await import("/src/main.tsx");
  </script>
</body>
</html>
